name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Inspect Expo autolinking metadata
        run: |
          while IFS= read -r file; do
            echo "--- $file ---"
            cat "$file"
          done < <(find node_modules -name expo-module.config.json)
          echo '--- generated autolinking metadata ---'
          find android \( -iname '*autolink*json' -o -iname '*modules*.json' \) -print | head -30
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: digiafrik-viral-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
